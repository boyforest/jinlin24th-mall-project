name: jinlin24th

services:
  mysql:
    image: mysql:8.4
    container_name: jinlin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jinlin24th}
      # 业务账号：backend 用它连接，避免应用直接用 root（最小权限原则）
      MYSQL_APP_USER: ${MYSQL_APP_USER:-jinlin_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化（数据卷为空）时按文件名顺序执行
      - ./deploy/mysql/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/mysql/init/02-product-ops.sql:/docker-entrypoint-initdb.d/02-product-ops.sql:ro
      # 演示数据不进入生产初始化流程（需要时手工执行：
      #   docker exec -i jinlin-mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" jinlin24th < sql/demo_seed.sql）
      - ./deploy/mysql/init/04-app-user.sh:/docker-entrypoint-initdb.d/04-app-user.sh:ro
      - ./sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: jinlin-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
      redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: jinlin24th-backend:latest
    container_name: jinlin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jinlin24th}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      # 业务账号（非 root），仅 jinlin24th 库 DML 权限，由 04-app-user.sh 创建
      DB_USERNAME: ${MYSQL_APP_USER:-jinlin_app}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Redis 中保存登录态 jti，必须设置密码（配合 JWT 密钥构成完整认证边界）
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in .env}
      WX_MINIAPP_APPID: ${WX_MINIAPP_APPID:-}
      WX_MINIAPP_SECRET: ${WX_MINIAPP_SECRET:-}
      WX_PAY_ENABLED: ${WX_PAY_ENABLED:-false}
      WX_PAY_MCH_ID: ${WX_PAY_MCH_ID:-}
      WX_PAY_API_V3_KEY: ${WX_PAY_API_V3_KEY:-}
      WX_PAY_SERIAL_NO: ${WX_PAY_SERIAL_NO:-}
      WX_PAY_PLATFORM_PUBLIC_KEY_ID: ${WX_PAY_PLATFORM_PUBLIC_KEY_ID:-}
      WX_PAY_PRIVATE_KEY_PATH: ${WX_PAY_PRIVATE_KEY_PATH:-}
      WX_PAY_CERTIFICATE_PATH: ${WX_PAY_CERTIFICATE_PATH:-}
      # 注意：这两项如果传空字符串，会覆盖 Spring 侧的默认值，导致回调地址为空。
      # WxPayConfig 会在 wx.pay.enabled=true 时校验非空且为 https，配置错误直接启动失败。
      WX_PAY_NOTIFY_URL: ${WX_PAY_NOTIFY_URL:-}
      WX_PAY_REFUND_NOTIFY_URL: ${WX_PAY_REFUND_NOTIFY_URL:-}
      ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-false}
      # 订单超时兜底（MQ 关闭时唯一能释放库存的机制）。
      # 用 :- 给出与 application.yml 一致的默认值，避免"空字符串覆盖默认值"的陷阱。
      ORDER_TIMEOUT_CANCEL_SECONDS: ${ORDER_TIMEOUT_CANCEL_SECONDS:-1800}
      ORDER_TIMEOUT_SCAN_INTERVAL_MS: ${ORDER_TIMEOUT_SCAN_INTERVAL_MS:-300000}
      ORDER_TIMEOUT_SCAN_BATCH_SIZE: ${ORDER_TIMEOUT_SCAN_BATCH_SIZE:-200}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-7878}:7878"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
      - ./certs:/app/certs:ro

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    image: jinlin24th-admin-web:latest
    container_name: jinlin-admin-web
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: jinlin-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - admin-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot

volumes:
  mysql_data:
  redis_data:
  uploads:
  logs:
  certbot-webroot:
