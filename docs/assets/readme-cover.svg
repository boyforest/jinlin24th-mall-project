      <stop offset="0" stop-color="#183b30"/>
      <stop offset="1" stop-color="#315747"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a2b58c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#a2b58c" stop-opacity="0"/>
    </radialGradient>
    <path id="tick" d="M 0 -143 L 0 -153"/>
    <path id="quarter" d="M 0 -138 L 0 -158"/>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#background)"/>
  <circle cx="1050" cy="185" r="280" fill="url(#glow)"/>
  <path d="M 0 350 Q 430 245 800 360 T 1280 325" fill="none" stroke="#9fb28d" stroke-opacity=".13"/>
  <path d="M 0 368 Q 430 263 800 378 T 1280 343" fill="none" stroke="#9fb28d" stroke-opacity=".08"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
