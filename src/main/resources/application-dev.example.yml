server:
  port: 7878

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jinlin24th?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: your-local-mysql-password

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1

wx:
  miniapp:
    appid: your-miniapp-appid
    secret: your-miniapp-secret
  pay:
    enabled: false
    mch-id:
    api-v3-key:
    serial-no:
    platform-public-key-id:
    private-key-path:
    certificate-path:

jwt:
  secret: replace-with-at-least-32-bytes-dev-secret
  expiration: 604800000

admin:
  username: admin
  password: change-me

app:
  mq:
    enabled: false

# 咖啡阶段 A：先执行 sql/migrations/20261024_coffee_catalog_cart.sql，
# 再以 SUPER_ADMIN 维护真实门店/菜单，设置环境变量 COFFEE_CATALOG_ENABLED=true。
# 下单默认关闭；本轮执行 20261026_coffee_workbench_rbac.sql 后增加独立交易能力。
# COFFEE_ORDERING_ENABLED=false；COFFEE_PAYMENT_ENABLED=false。
# 独立商户和提醒环境变量见 .env.example，不复用商品商户。
# GOODS_STORE_NAME 用于统一订单列表的商品商城展示名。

# 本地调试；生产配置始终保持关闭。
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
