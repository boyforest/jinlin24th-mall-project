server:
  port: 7878

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jinlin24th?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: your-local-mysql-password

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1

wx:
  miniapp:
    appid: your-miniapp-appid
    secret: your-miniapp-secret
  pay:
    enabled: false
    mch-id:
    api-v3-key:
    serial-no:
    platform-public-key-id:
    private-key-path:
    certificate-path:

jwt:
  secret: replace-with-at-least-32-bytes-dev-secret
  expiration: 604800000

admin:
  username: admin
  password: change-me

app:
  mq:
    enabled: false

# 咖啡阶段 A：先执行 sql/migrations/20261024_coffee_catalog_cart.sql，
# 再以 SUPER_ADMIN 维护真实门店/菜单，设置环境变量 COFFEE_CATALOG_ENABLED=true。
# 默认 false；仅开放浏览/加购，不存在开启咖啡下单或支付的配置。
# GOODS_STORE_NAME 用于统一订单列表的商品商城展示名。
