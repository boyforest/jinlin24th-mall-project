# ============================================================
# 金霖二十四养 — 生产环境配置模板（仅作参考，不再需要复制）
#
# 说明：真正的生产配置已提交为同目录下的 application-prod.yml，
#       它不包含任何密钥，只引用环境变量，因此可以安全入库。
#
# 本 .example.yml 保留仅为对比参考；如需调整生产参数，请直接修改
# application-prod.yml，不要再依赖"复制模板"的流程（那正是此前
# Swagger 与 SQL 日志在生产意外全开的根因）。
# ============================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

# 生产环境关闭 SQL 日志，避免每条查询都打控制台
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 生产环境禁用 Swagger / OpenAPI 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Tomcat 线程池调优
server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

# JWT 密钥：必须通过环境变量注入，不设默认值
jwt:
  secret: ${JWT_SECRET}

# CORS：必须通过环境变量显式指定允许的域名，不设 localhost 兜底
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 日志配置：文件输出 + 滚动策略
logging:
  level:
    root: WARN
    com.jinlin24th.jinlin: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    com.baomidou.mybatisplus: WARN
    org.apache.rocketmq: WARN
  file:
    name: /app/logs/jinlin24th.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB

# 咖啡阶段 A：先执行 sql/migrations/20261024_coffee_catalog_cart.sql，
# 再以 SUPER_ADMIN 维护真实门店/菜单，设置环境变量 COFFEE_CATALOG_ENABLED=true。
# 默认 false；仅开放浏览/加购，不存在开启咖啡下单或支付的配置。
# GOODS_STORE_NAME 用于统一订单列表的商品商城展示名。

# 咖啡独立商户/回调及模板变量见 .env.example；COFFEE_ORDERING_ENABLED 默认 false。
